name: Verify Zotero ChatGPT PDF

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run authorization and protocol tests
        run: |
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Install Zotero runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth libgtk-3-0 libdbus-glib-1-2 libx11-xcb1 libxt6 fonts-noto-cjk
      - name: Test PDF selection in the reader and translate a synthetic PDF in Zotero 10.0.8
        run: bash tests/native/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-zotero-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/zotero-chatgpt-pdf-native/*.log
            ${{ runner.temp }}/zotero-chatgpt-pdf-native/result.json
            ${{ runner.temp }}/zotero-chatgpt-pdf-native/reader-translation.png
